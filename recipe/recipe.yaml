schema_version: 1

context:
  name: spikeinterface
  version: "0.106.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/spikeinterface-${{ version }}.tar.gz
  sha256: 56a10323eb60223ff5da5d333e591cf205dca638f8ff9f0214056287319a6185

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - setuptools >=78.0.2
    - pip
  run:
    - python
    - if: match(python, ">=3.14")
      then: numpy >=2.3.2
      else: numpy >=2.0.0
    - threadpoolctl >=3.0.0
    - tqdm
    - zarr >=3,<4
    - python-neo >=0.14.6
    - probeinterface >=0.5.0
    - packaging
    - pydantic
  run_constraints:
    - kilosort >=4.0.16

tests:
  - python:
      imports:
        - spikeinterface
      pip_check: true

about:
  summary: Python toolkit for analysis, visualization, and comparison of spike sorting output
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/SpikeInterface/spikeinterface
  repository: https://github.com/SpikeInterface/spikeinterface
  documentation: https://spikeinterface.readthedocs.io/

extra:
  recipe-maintainers:
    - dhmjhu
