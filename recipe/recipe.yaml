schema_version: 1

context:
  name: spikeinterface
  version: "0.105.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/spikeinterface-${{ version }}.tar.gz
  sha256: 147a93df65270706ccc309574c768aca4eb482d62d8496c0dcabb8cfb6bd3a67

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - setuptools >=78.0.2
    - pip
  run:
    - python
    - threadpoolctl >=3.0.0
    - tqdm
    - python-neo >=0.14.5
    - probeinterface >=0.4.0
    - packaging
    - pydantic
    - if: match(python, ">=3.14")
      then:
        - numpy >=2.3.2
        - zarr >=3
        - numcodecs >=0.16.5
      else:
        - numpy >=2.0.0
        - zarr >=2.18,<3
        - numcodecs <0.16.0
  run_constraints:
    - kilosort >=4.0.16

tests:
  - python:
      imports:
        - spikeinterface
      pip_check: true

about:
  summary: Python toolkit for analysis, visualization, and comparison of spike sorting output
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/SpikeInterface/spikeinterface
  repository: https://github.com/SpikeInterface/spikeinterface
  documentation: https://spikeinterface.readthedocs.io/

extra:
  recipe-maintainers:
    - dhmjhu
